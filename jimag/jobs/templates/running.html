<!DOCTYPE html>
{% load static %}
<head>
    <link rel="stylesheet" href="{% static 'styles/running.css' %}">
  <title>Running job {{ job_id }}</title>
</head>
<center>
<div id="progress-div" class="monospace-box">Your job will start briefly...</div>
</center>

<script>
  var job_id = "{{ job_id }}";
  function updateProgress() {
    fetch('{% url "check_progress" %}?job_id=' + job_id)
      .then(r => r.json())
      .then(data => {
        const div = document.getElementById('progress-div');
        // replace newlines with <br>, keep everything else as text
        const escaped = data.progress
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/\n/g, '<br>');
        div.innerHTML = '<pre>' + escaped + '</pre>';
        //if (data.done && data.redirect_url) {
        //  clearInterval(progressInterval);
        //  window.location.href = data.redirect_url;
        //}
        if (data.done) {
            clearInterval(progressInterval);
            if (data.failed) {
                // stay on page; append a "back" button
                const div = document.getElementById('progress-div');
                div.innerHTML += '<br><br><a href="/jobs/">← Back to jobs</a>';
            } else if (data.redirect_url) {
                window.location.href = data.redirect_url;
            }
        }
      })
      .catch(e => console.error('poll failed', e));
  }
  updateProgress();
  // Periodically update progress every 2 seconds (adjust as needed)
  const progressInterval = setInterval(updateProgress, 2000);
</script></html>
