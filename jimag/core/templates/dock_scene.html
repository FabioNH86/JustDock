<div class="dock-scene" aria-hidden="true">
    <div class="halo"></div>
    <div class="halo"></div>
    <div class="halo"></div>
    <svg width="200" height="200" viewBox="0 0 200 200">
        <defs>
            <radialGradient id="recGrad" cx="38%" cy="35%" r="70%">
                <stop offset="0%" stop-color="#93bfff"/>
                <stop offset="55%" stop-color="#2f76f0"/>
                <stop offset="100%" stop-color="#12336b"/>
            </radialGradient>
            <radialGradient id="atomGrad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#38bdf8"/>
            </radialGradient>
        </defs>
        <!-- receptor: a protein-like blob with a binding pocket -->
        <g class="receptor">
            <path d="M100 58c18 0 30 6 38 18 7 10 6 22 2 30-5 10-16 10-22 4-6-6-14-6-18 0-5 7 0 15-6 21-8 8-26 6-36-4-11-11-13-31-4-46 9-15 26-23 46-23z"
                  fill="url(#recGrad)" opacity=".95"/>
            <circle cx="88" cy="84" r="5" fill="#fff" opacity=".35"/>
        </g>
        <!-- orbit tracks -->
        <ellipse cx="100" cy="100" rx="82" ry="82" fill="none" stroke="rgba(147,191,255,.25)" stroke-dasharray="3 6"/>
        <ellipse cx="100" cy="100" rx="62" ry="62" fill="none" stroke="rgba(147,191,255,.18)"/>
        <!-- ligand orbiting -->
        <g class="orbit">
            <g class="ligand" transform="translate(166 92)">
                <line x1="0" y1="0" x2="12" y2="-8" stroke="#c4dbff" stroke-width="2.5"/>
                <line x1="0" y1="0" x2="12" y2="8" stroke="#c4dbff" stroke-width="2.5"/>
                <line x1="12" y1="-8" x2="24" y2="0" stroke="#c4dbff" stroke-width="2.5"/>
                <circle cx="0" cy="0" r="5.5" fill="url(#atomGrad)"/>
                <circle cx="12" cy="-8" r="4.5" fill="url(#atomGrad)"/>
                <circle cx="12" cy="8" r="4" fill="#5b9bff"/>
                <circle cx="24" cy="0" r="5" fill="url(#atomGrad)"/>
            </g>
        </g>
        <!-- small electrons on the inner orbit -->
        <g class="orbit reverse">
            <circle cx="100" cy="38" r="3.5" fill="#22d3ee"/>
            <circle cx="46" cy="131" r="2.5" fill="#93bfff"/>
            <circle cx="154" cy="131" r="3" fill="#5b9bff"/>
        </g>
    </svg>
</div>
